[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-predictability"
version = "1.0.0"
description = "Model-agnostic predictability scoring for multivariable time series"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuxuan Shu" },
  { name = "Vasileios Lampos" },
]
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["maps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

